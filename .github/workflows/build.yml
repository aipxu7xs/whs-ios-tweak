name: Build WHS iOS dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS SDK (theos/sdks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, os
          hdr = {"Accept": "application/vnd.github+json",
                 "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
          d = json.load(urllib.request.urlopen(
              urllib.request.Request("https://api.github.com/repos/theos/sdks/releases/latest", headers=hdr), timeout=30))
          cands = [a for a in d["assets"]
                   if a["name"].startswith("iPhoneOS") and a["name"].endswith(".sdk.tar.xz")]
          cands.sort(key=lambda a: [int(x) for x in re.findall(r'\d+', a["name"])])
          best = cands[-1]
          print("selected SDK asset:", best["name"])
          urllib.request.urlretrieve(best["browser_download_url"], "iPhoneOS.sdk.tar.xz")
          PY
          tar -xf iPhoneOS.sdk.tar.xz
          echo "SDK=$PWD/$(ls -d iPhoneOS*.sdk | head -1)" >> "$GITHUB_ENV"
          echo "使用 SDK: $SDK"

      - name: Build tweak.dylib
        run: make SDK="$SDK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WHS-tweak-dylib
          path: tweak.dylib

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" tweak.dylib \
            --title "WHS dylib 自动构建 #${{ github.run_number }}" \
            --notes "云端自动构建的 tweak.dylib（注入小红书 iOS 即可原图下载 + EXIF）。" \
            || gh release upload "$TAG" tweak.dylib --clobber
